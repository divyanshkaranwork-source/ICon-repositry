<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Folio</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="sheet">
      <header class="head">
        <div class="wordmark"><img src="icons/mark.svg" alt="" width="20" height="20" /><span>Folio</span></div>
        <label class="power">
          <input type="checkbox" id="enabled" />
          <span class="track" aria-hidden="true"></span>
          <span class="power-label" id="power-label">On</span>
        </label>
      </header>
      <p class="lede">File and folder icons for GitHub.</p>

      <section>
        <h2>Edition</h2>
        <div class="editions" id="editions" role="radiogroup" aria-label="Edition"></div>
      </section>

      <section>
        <h2>Options</h2>
        <label class="row">
          <span>Folder icons</span>
          <input type="checkbox" id="folders" class="check" />
        </label>
        <div class="row">
          <span>Appearance</span>
          <div class="seg" id="mode" role="radiogroup" aria-label="Appearance">
            <button data-mode="auto">Auto</button><button data-mode="dark">Dark</button><button data-mode="light">Light</button>
          </div>
        </div>
      </section>

      <footer class="foot">
        <a href="dist/gallery.html" target="_blank">Index of all icons&ensp;→</a>
        <span id="version"></span>
      </footer>
    </main>
    <script src="dist/popup.js"></script>
  </body>
</html>
